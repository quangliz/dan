[project]
name = "dan"
version = "0.0.1"
description = "Fast, easy System One model inference and serving on open-weight causal LMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "safetensors",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
dan = "dan.entrypoints.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a downloaded HF model (slow)"]
